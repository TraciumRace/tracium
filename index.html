<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sheet Live</title>

  <style>
    body { margin: 0; }
    iframe { width: 100%; height: 100vh; border: none; }
  </style>
</head>

<body>

<iframe id="sheetFrame"></iframe>

<script>
const baseUrl = "https://docs.google.com/spreadsheets/d/2PACX-1vQsY4-BlrFhBYtHEN9JdPZbjFQznkwVRNKxYuczxsZ1XTcNc-Gqp7cU8EZ9vv6VEJAhJblPgBu4MkD0/export?format=html&gid=0";

function refreshSheet() {
  const iframe = document.getElementById("sheetFrame");
  iframe.src = baseUrl + "&cache=" + new Date().getTime();
}

// chargement initial
refreshSheet();

// refresh toutes les 5 secondes
setInterval(refreshSheet, 5000);
</script>

</body>
</html>
