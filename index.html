<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Google Sheet Live</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

<iframe id="sheetFrame"></iframe>

<script>
  const url = "https://docs.google.com/spreadsheets/d/e/15pksFO_n5NOwljJaQX8ZPx6Mfzkb_-FIe9jmQJDkoxQ/pub?output=html&gid=0&single=true";
  function refreshSheet() {
    const iframe = document.getElementById("sheetFrame");
    iframe.src = url + "&cache=" + new Date().getTime();
  }

  // Chargement initial
  refreshSheet();

  // Refresh toutes les 5 secondes
  setInterval(refreshSheet, 5000);
</script>

</body>
</html>
