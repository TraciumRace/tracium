<iframe id="sheetFrame"></iframe>

<script>
const url = "https://docs.google.com/spreadsheets/d/15pksFO_n5NOwljJaQX8ZPx6Mfzkb_-FIe9jmQJDkoxQ/export?format=html";

function refreshSheet() {
  const iframe = document.getElementById("sheetFrame");
  iframe.src = url + "&cache=" + new Date().getTime();
}

refreshSheet();
setInterval(refreshSheet, 5000);
</script>
